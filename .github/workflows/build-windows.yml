name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name GerenciadorDeVendas app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorDeVendas-Windows
          path: dist/GerenciadorDeVendas.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: GerenciadorDeVendas-Windows
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/GerenciadorDeVendas.exe" --title "$env:GITHUB_REF_NAME" --generate-notes